name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

permissions:
  contents: write      # allows publishing the APK as a Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # avoid the deprecated 'tools' package that breaks setup

      - name: Install required SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tool-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a Release asset (unique tag per build)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NFC Tool build ${{ github.run_number }}" \
            --notes "Sideload app-debug.apk onto the Galaxy S8."
